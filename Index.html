<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE貼圖兌換序號核銷系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS CDN (支援 Excel / CSV 解析與匯出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F4F7F4',
              100: '#E4EDE5',
              200: '#C9DCCB',
              500: '#4A7C59',
              600: '#3D6849',
              700: '#2E5137',
              800: '#233E2B'
            },
            sand: {
              50: '#FAF8F5',
              100: '#F3EFEA',
              200: '#E7DFD5',
              700: '#6E675F',
              800: '#433E38'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* 質感平滑陰影與微動態 */
    .glass-card {
      background: #FFFFFF;
      box-shadow: 0 4px 20px -2px rgba(67, 62, 56, 0.06), 0 2px 6px -1px rgba(67, 62, 56, 0.04);
    }
    .status-enter {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF8F5;
    }
    ::-webkit-scrollbar-thumb {
      background: #D7D0C5;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #BAB1A3;
    }
  </style>
</head>
<body class="bg-sand-50 text-sand-800 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-100 selection:text-brand-800">

  <!-- 頂部導航列 -->
  <header class="bg-white/80 backdrop-blur-md border-b border-sand-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-sm">
          <i class="ph ph-ticket text-2xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-sand-800 tracking-tight flex items-center gap-2">
            LINE 貼圖兌換驗證系統
            <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-brand-50 text-brand-700 border border-brand-200">廠商核銷專用</span>
          </h1>
          <p class="text-xs text-sand-700">快速比對得獎者序號，防止重複領取與冒領</p>
        </div>
      </div>
      
      <!-- 設定快速切換 -->
      <div class="flex items-center gap-3">
        <button id="btnSoundToggle" title="音效開關" class="p-2.5 rounded-xl border border-sand-200 hover:bg-sand-100 text-sand-700 transition flex items-center gap-1.5 text-xs font-medium">
          <i id="soundIcon" class="ph ph-speaker-high text-base"></i>
          <span class="hidden sm:inline" id="soundLabel">提示音: 開</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full space-y-6">

    <!-- 步驟 1: 匯入與狀態卡片 (可收合/展開) -->
    <section class="glass-card rounded-2xl border border-sand-200 p-5 transition-all">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-sand-100">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-sand-200 text-sand-800 flex items-center justify-center text-xs font-bold">1</span>
          <h2 class="font-bold text-sand-800">序號資料庫清單</h2>
          <span id="dataStatusBadge" class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-amber-50 text-amber-700 border border-amber-200">
            尚未匯入清單
          </span>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button id="btnToggleImport" class="text-xs px-3 py-1.5 rounded-lg border border-sand-200 hover:bg-sand-100 text-sand-700 font-medium transition flex items-center gap-1">
            <i class="ph ph-upload-simple"></i>
            <span>匯入 / 更新名單</span>
          </button>
          <button id="btnExportExcel" class="text-xs px-3 py-1.5 rounded-lg bg-sand-100 hover:bg-sand-200 text-sand-800 font-medium transition flex items-center gap-1 disabled:opacity-50 disabled:pointer-events-none" disabled>
            <i class="ph ph-download-simple"></i>
            <span>匯出核銷紀錄</span>
          </button>
          <button id="btnClearData" class="text-xs px-3 py-1.5 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 font-medium transition disabled:opacity-40 disabled:pointer-events-none" disabled>
            <i class="ph ph-trash"></i>
            <span>清空重設</span>
          </button>
        </div>
      </div>

      <!-- 統計指針 -->
      <div class="grid grid-cols-3 gap-3 pt-4">
        <div class="bg-sand-50 rounded-xl p-3 border border-sand-200/60">
          <div class="text-xs text-sand-700 font-medium">總序號筆數</div>
          <div class="text-2xl font-bold text-sand-800 mt-1" id="statTotal">0</div>
        </div>
        <div class="bg-emerald-50/60 rounded-xl p-3 border border-emerald-100">
          <div class="text-xs text-emerald-700 font-medium">已完成兌換</div>
          <div class="text-2xl font-bold text-emerald-700 mt-1" id="statRedeemed">0</div>
        </div>
        <div class="bg-amber-50/60 rounded-xl p-3 border border-amber-100">
          <div class="text-xs text-amber-800 font-medium">尚待兌換</div>
          <div class="text-2xl font-bold text-amber-800 mt-1" id="statPending">0</div>
        </div>
      </div>

      <!-- 匯入面板區塊 (預設若沒資料就打開，有資料可收起) -->
      <div id="importContainer" class="mt-4 pt-4 border-t border-sand-100 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 檔案拖曳上傳 -->
          <div id="dropZone" class="border-2 border-dashed border-sand-200 hover:border-brand-500 rounded-xl p-6 text-center transition cursor-pointer bg-white group flex flex-col items-center justify-center min-h-[140px]">
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden">
            <i class="ph ph-file-arrow-up text-3xl text-sand-700 group-hover:text-brand-600 mb-2 transition"></i>
            <p class="text-sm font-semibold text-sand-800">點擊或拖曳 Excel / CSV 檔案至此</p>
            <p class="text-xs text-sand-700 mt-1">自動辨識含有「序號 / Code」欄位或首欄資料</p>
          </div>

          <!-- 手動貼上序號 -->
          <div class="space-y-2">
            <label class="text-xs font-semibold text-sand-700 flex justify-between">
              <span>手動貼上序號清單（一行一筆）</span>
              <span id="pasteCounter" class="text-sand-700 font-normal">0 筆</span>
            </label>
            <textarea id="pasteInput" rows="3" placeholder="例如：&#10;LINE-8X9A2&#10;LINE-5K2Z1&#10;LINE-9Q1B4" class="w-full text-xs p-2.5 rounded-xl border border-sand-200 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 font-mono"></textarea>
            <div class="text-right">
              <button id="btnParsePasted" class="text-xs px-3 py-1.5 rounded-lg bg-brand-500 hover:bg-brand-600 text-white font-medium transition">
                解析並加入清單
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 步驟 2: 核心即時查詢比對介面 -->
    <section class="glass-card rounded-2xl border border-sand-200 p-6 sm:p-8 space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-brand-500 text-white flex items-center justify-center text-xs font-bold">2</span>
          <h2 class="font-bold text-lg text-sand-800">輸入讀者傳來的序號</h2>
        </div>
        <!-- 比對設定開關 -->
        <div class="flex items-center gap-4 text-xs text-sand-700">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="chkAutoRedeem" class="rounded text-brand-600 focus:ring-brand-500 w-3.5 h-3.5">
            <span>完全一致時自動核銷</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="chkIgnoreCase" checked class="rounded text-brand-600 focus:ring-brand-500 w-3.5 h-3.5">
            <span>忽略英文大小寫</span>
          </label>
        </div>
      </div>

      <!-- 序號輸入區塊 -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-sand-700">
          <i class="ph ph-magnifying-glass text-2xl"></i>
        </div>
        <input 
          type="text" 
          id="codeQueryInput" 
          placeholder="請在此貼上或輸入序號（按 Enter 立即驗證）..." 
          autocomplete="off"
          spellcheck="false"
          class="w-full pl-12 pr-28 py-4 text-lg sm:text-xl font-mono tracking-wider font-semibold rounded-2xl border-2 border-sand-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 focus:outline-none transition placeholder:text-sand-700/60 placeholder:text-base placeholder:font-sans"
        >
        <div class="absolute inset-y-0 right-2 flex items-center gap-1">
          <button id="btnClearInput" class="p-2 text-sand-700 hover:text-sand-800 hover:bg-sand-100 rounded-xl transition" title="清空輸入框">
            <i class="ph ph-x text-lg"></i>
          </button>
          <button id="btnCheckCode" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm transition shadow-sm active:scale-95">
            比對
          </button>
        </div>
      </div>

      <!-- 比對結果狀態卡片 (動態更新) -->
      <div id="resultCard" class="hidden rounded-2xl border p-6 transition-all duration-300">
        <!-- 動態由 JavaScript 渲染 -->
      </div>
    </section>

    <!-- 步驟 3: 核銷紀錄與清單管理 -->
    <section class="glass-card rounded-2xl border border-sand-200 overflow-hidden">
      <div class="p-4 sm:p-5 border-b border-sand-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-sand-200 text-sand-800 flex items-center justify-center text-xs font-bold">3</span>
          <h2 class="font-bold text-sand-800">全部序號檢視</h2>
          <span id="badgeFilteredCount" class="text-xs px-2 py-0.5 rounded-md bg-sand-100 text-sand-700 font-medium">0 筆</span>
        </div>

        <div class="flex items-center gap-2">
          <!-- 狀態過濾 -->
          <select id="filterStatus" class="text-xs py-1.5 px-2.5 rounded-lg border border-sand-200 focus:outline-none focus:border-brand-500 bg-white">
            <option value="all">全部狀態</option>
            <option value="pending">尚未兌換</option>
            <option value="redeemed">已兌換發送</option>
          </select>
          <!-- 搜尋文字 -->
          <div class="relative">
            <input type="text" id="filterKeyword" placeholder="清單內搜尋..." class="text-xs pl-7 pr-2.5 py-1.5 rounded-lg border border-sand-200 focus:outline-none focus:border-brand-500">
            <i class="ph ph-magnifying-glass absolute left-2 top-2 text-sand-700 text-xs"></i>
          </div>
        </div>
      </div>

      <!-- 表格清單 -->
      <div class="overflow-x-auto max-h-80 overflow-y-auto">
        <table class="w-full text-left border-collapse text-xs sm:text-sm">
          <thead class="bg-sand-50/80 sticky top-0 border-b border-sand-200 text-sand-700 font-semibold">
            <tr>
              <th class="py-2.5 px-4 w-12 text-center">#</th>
              <th class="py-2.5 px-4 font-mono">兌換序號</th>
              <th class="py-2.5 px-4 w-32">狀態</th>
              <th class="py-2.5 px-4 w-44">核銷時間</th>
              <th class="py-2.5 px-4 w-24 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-sand-100 text-sand-800">
            <tr>
              <td colspan="5" class="py-8 text-center text-sand-700">目前尚無序號資料，請先自上方匯入 Excel 或 CSV</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- 頁尾 -->
  <footer class="border-t border-sand-200 py-4 text-center text-xs text-sand-700">
    <p>純前端安全運行・資料完整保留於本地瀏覽器・活動完畢後請匯出留存</p>
  </footer>

  <!-- 提示訊息 Modal (取代原生 alert) -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full glass-card space-y-4 status-enter">
      <div class="flex items-center gap-3">
        <div id="modalIcon" class="w-10 h-10 rounded-full flex items-center justify-center text-xl bg-sand-100 text-sand-800">
          <i class="ph ph-info"></i>
        </div>
        <h3 id="modalTitle" class="font-bold text-base text-sand-800">提示</h3>
      </div>
      <p id="modalMessage" class="text-sm text-sand-700 leading-relaxed"></p>
      <div class="flex justify-end gap-2 pt-2">
        <button id="btnModalCancel" class="hidden px-4 py-2 rounded-xl text-xs font-semibold border border-sand-200 hover:bg-sand-100 text-sand-700 transition">
          取消
        </button>
        <button id="btnModalConfirm" class="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-500 hover:bg-brand-600 text-white transition">
          確定
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- 應用程式狀態管理 ---
    const STORAGE_KEY = 'LINE_COUPON_CODES_DATA_V1';
    const SETTINGS_KEY = 'LINE_COUPON_SETTINGS_V1';

    // 格式: { code: string, isRedeemed: boolean, redeemedAt: string | null }
    let codeRecords = [];
    let settings = {
      soundEnabled: true,
      autoRedeem: false,
      ignoreCase: true
    };

    // 音效產生器 (Web Audio API，不需外部音訊檔)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playSuccess() {
        if (!settings.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      },
      playWarning() {
        if (!settings.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(349.23, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      },
      playFail() {
        if (!settings.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(196, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    };

    // DOM 元素引用
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const pasteInput = document.getElementById('pasteInput');
    const btnParsePasted = document.getElementById('btnParsePasted');
    const pasteCounter = document.getElementById('pasteCounter');
    const importContainer = document.getElementById('importContainer');
    const btnToggleImport = document.getElementById('btnToggleImport');
    const btnClearData = document.getElementById('btnClearData');
    const btnExportExcel = document.getElementById('btnExportExcel');

    const statTotal = document.getElementById('statTotal');
    const statRedeemed = document.getElementById('statRedeemed');
    const statPending = document.getElementById('statPending');
    const dataStatusBadge = document.getElementById('dataStatusBadge');

    const codeQueryInput = document.getElementById('codeQueryInput');
    const btnCheckCode = document.getElementById('btnCheckCode');
    const btnClearInput = document.getElementById('btnClearInput');
    const resultCard = document.getElementById('resultCard');
    const chkAutoRedeem = document.getElementById('chkAutoRedeem');
    const chkIgnoreCase = document.getElementById('chkIgnoreCase');

    const tableBody = document.getElementById('tableBody');
    const filterStatus = document.getElementById('filterStatus');
    const filterKeyword = document.getElementById('filterKeyword');
    const badgeFilteredCount = document.getElementById('badgeFilteredCount');

    const btnSoundToggle = document.getElementById('btnSoundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');

    // Modal 元件
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalIcon = document.getElementById('modalIcon');
    const btnModalCancel = document.getElementById('btnModalCancel');
    const btnModalConfirm = document.getElementById('btnModalConfirm');

    // --- 初始化流程 ---
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadStoredCodes();
      initEventListeners();
      renderUI();
      // 自動聚焦查詢框
      setTimeout(() => codeQueryInput.focus(), 300);
    });

    function showNotice(title, message, isConfirm = false, onConfirm = null) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      btnModalCancel.classList.toggle('hidden', !isConfirm);

      modalOverlay.classList.remove('hidden');
      modalOverlay.classList.add('flex');

      const handleConfirm = () => {
        cleanup();
        if (onConfirm) onConfirm();
      };

      const handleCancel = () => {
        cleanup();
      };

      const cleanup = () => {
        btnModalConfirm.removeEventListener('click', handleConfirm);
        btnModalCancel.removeEventListener('click', handleCancel);
        modalOverlay.classList.add('hidden');
        modalOverlay.classList.remove('flex');
      };

      btnModalConfirm.addEventListener('click', handleConfirm);
      btnModalCancel.addEventListener('click', handleCancel);
    }

    // 儲存與讀取 LocalStorage
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(codeRecords));
      } catch (e) {
        console.error('儲存失敗', e);
      }
    }

    function loadStoredCodes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          codeRecords = JSON.parse(raw);
        }
      } catch (e) {
        console.error('載入序號失敗', e);
        codeRecords = [];
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
          settings = { ...settings, ...JSON.parse(raw) };
        }
      } catch (e) {}

      chkAutoRedeem.checked = settings.autoRedeem;
      chkIgnoreCase.checked = settings.ignoreCase;
      updateSoundUI();
    }

    function updateSoundUI() {
      if (settings.soundEnabled) {
        soundIcon.className = 'ph ph-speaker-high text-base text-brand-600';
        soundLabel.textContent = '提示音: 開';
      } else {
        soundIcon.className = 'ph ph-speaker-slash text-base text-sand-700';
        soundLabel.textContent = '提示音: 關';
      }
    }

    // 格式化當前時間為 YYYY-MM-DD HH:mm:ss
    function formatDateTime(d = new Date()) {
      const pad = (n) => String(n).padStart(2, '0');
      const year = d.getFullYear();
      const month = pad(d.getMonth() + 1);
      const day = pad(d.getDate());
      const hours = pad(d.getHours());
      const mins = pad(d.getMinutes());
      const secs = pad(d.getSeconds());
      return `${year}-${month}-${day} ${hours}:${mins}:${secs}`;
    }

    // 註冊所有事件監聽
    function initEventListeners() {
      // 音效切換
      btnSoundToggle.addEventListener('click', () => {
        settings.soundEnabled = !settings.soundEnabled;
        updateSoundUI();
        saveSettings();
        if (settings.soundEnabled) AudioEngine.playSuccess();
      });

      // 設定切換
      chkAutoRedeem.addEventListener('change', (e) => {
        settings.autoRedeem = e.target.checked;
        saveSettings();
      });
      chkIgnoreCase.addEventListener('change', (e) => {
        settings.ignoreCase = e.target.checked;
        saveSettings();
      });

      // 匯入展開/隱藏切換
      btnToggleImport.addEventListener('click', () => {
        importContainer.classList.toggle('hidden');
      });

      // 清空所有資料
      btnClearData.addEventListener('click', () => {
        showNotice('清空序號清單', '確定要清空所有序號資料與核銷記錄嗎？此動作無法復原。', true, () => {
          codeRecords = [];
          saveToStorage();
          renderUI();
          resultCard.classList.add('hidden');
          showNotice('已清空', '資料已成功重設。');
        });
      });

      // 檔案上傳相關
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
          handleFile(e.target.files[0]);
          e.target.value = ''; // 允許重複上傳同檔名
        }
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-brand-500', 'bg-brand-50/40');
      });
      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-brand-500', 'bg-brand-50/40');
      });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-brand-500', 'bg-brand-50/40');
        if (e.dataTransfer.files.length) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      // 手動貼上計數
      pasteInput.addEventListener('input', () => {
        const lines = pasteInput.value.split('\n').filter(s => s.trim().length > 0);
        pasteCounter.textContent = `${lines.length} 筆`;
      });

      btnParsePasted.addEventListener('click', () => {
        const text = pasteInput.value.trim();
        if (!text) {
          showNotice('提示', '請先貼上序號資料。');
          return;
        }
        const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
        appendCodes(lines);
        pasteInput.value = '';
        pasteCounter.textContent = '0 筆';
      });

      // 快速比對事件
      btnCheckCode.addEventListener('click', performVerification);
      codeQueryInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          performVerification();
        }
      });
      btnClearInput.addEventListener('click', () => {
        codeQueryInput.value = '';
        resultCard.classList.add('hidden');
        codeQueryInput.focus();
      });

      // 表格篩選事件
      filterStatus.addEventListener('change', renderTable);
      filterKeyword.addEventListener('input', renderTable);

      // 匯出 Excel
      btnExportExcel.addEventListener('click', exportToExcel);
    }

    // 處理上傳檔案
    function handleFile(file) {
      const reader = new FileReader();
      const ext = file.name.split('.').pop().toLowerCase();

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[firstSheetName];
          
          // 轉成二維陣列
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          if (!rows || rows.length === 0) {
            showNotice('解析失敗', '檔案內未發現有效資料。');
            return;
          }

          // 智慧識別序號欄位
          let targetColIndex = 0;
          let startRow = 0;

          // 檢查第一行是否為標題
          const headerRow = rows[0] || [];
          const keywords = ['序號', 'code', '兌換碼', '中獎代碼', '獎品序號', '貼圖序號', '券號'];
          for (let i = 0; i < headerRow.length; i++) {
            const val = String(headerRow[i] || '').trim().toLowerCase();
            if (keywords.some(k => val.includes(k))) {
              targetColIndex = i;
              startRow = 1;
              break;
            }
          }

          const extracted = [];
          for (let r = startRow; r < rows.length; r++) {
            const row = rows[r];
            if (row && row[targetColIndex] !== undefined && row[targetColIndex] !== null) {
              const codeStr = String(row[targetColIndex]).trim();
              if (codeStr) extracted.push(codeStr);
            }
          }

          if (extracted.length === 0) {
            showNotice('未找到序號', '無法在第一欄或標題為「序號」的欄位中讀取到資料。');
            return;
          }

          appendCodes(extracted);
        } catch (err) {
          console.error(err);
          showNotice('檔案讀取錯誤', '解析檔案時發生異常，請確認檔案格式是否正確。');
        }
      };

      reader.readAsArrayBuffer(file);
    }

    // 新增序號到資料庫 (過濾重複)
    function appendCodes(newList) {
      let addedCount = 0;
      let dupCount = 0;

      // 使用 Set 快速查核既有序號
      const existingMap = new Set(codeRecords.map(item => item.code.trim().toUpperCase()));

      newList.forEach(rawCode => {
        const clean = String(rawCode).trim();
        if (!clean) return;

        const checkKey = clean.toUpperCase();
        if (existingMap.has(checkKey)) {
          dupCount++;
        } else {
          existingMap.add(checkKey);
          codeRecords.push({
            code: clean,
            isRedeemed: false,
            redeemedAt: null
          });
          addedCount++;
        }
      });

      saveToStorage();
      renderUI();

      let msg = `成功匯入 ${addedCount} 筆序號！`;
      if (dupCount > 0) {
        msg += `（自動忽略 ${dupCount} 筆重複或已存在之序號）`;
      }
      showNotice('匯入完成', msg);

      // 若有資料則預設隱藏匯入卡片，保持介面簡潔
      if (codeRecords.length > 0) {
        importContainer.classList.add('hidden');
      }
    }

    // --- 核心比對邏輯 ---
    function performVerification() {
      const rawInput = codeQueryInput.value.trim();

      if (!rawInput) {
        codeQueryInput.focus();
        return;
      }

      if (codeRecords.length === 0) {
        showNotice('尚未匯入清單', '請先點擊上方「匯入名單」上傳得獎者序號 Excel 或手動貼上。');
        return;
      }

      // 比對處理
      const isIgnore = chkIgnoreCase.checked;
      const targetQuery = isIgnore ? rawInput.toUpperCase() : rawInput;

      // 尋找目標
      const foundIndex = codeRecords.findIndex(item => {
        const comp = isIgnore ? item.code.toUpperCase() : item.code;
        return comp === targetQuery;
      });

      if (foundIndex === -1) {
        // 【不符兌換資格】
        AudioEngine.playFail();
        renderResultMismatch(rawInput);
      } else {
        const record = codeRecords[foundIndex];
        if (record.isRedeemed) {
          // 【已兌換過】
          AudioEngine.playWarning();
          renderResultAlreadyRedeemed(record);
        } else {
          // 【符合資格且尚未兌換】
          AudioEngine.playSuccess();
          if (chkAutoRedeem.checked) {
            // 自動標記為已兌換
            executeRedeem(foundIndex, true);
          } else {
            renderResultValid(record, foundIndex);
          }
        }
      }
    }

    // 渲染：符合兌換資格
    function renderResultValid(record, index) {
      resultCard.className = 'rounded-2xl border-2 border-emerald-500 bg-emerald-50/70 p-6 status-enter';
      resultCard.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white shadow-sm">
              <i class="ph ph-check-circle-fill text-sm"></i>
              驗證通過
            </div>
            <h3 class="text-2xl sm:text-3xl font-extrabold text-emerald-800 tracking-tight">符合兌換資格！</h3>
            <p class="text-xs sm:text-sm text-emerald-700 font-mono mt-1">
              核對序號：<span class="font-bold bg-white px-2 py-0.5 rounded border border-emerald-300">${escapeHtml(record.code)}</span>
            </p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="executeRedeem(${index})" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm tracking-wide shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 active:scale-95">
              <i class="ph ph-paper-plane-tilt text-lg"></i>
              <span>確認兌換 / 標記已發送</span>
            </button>
          </div>
        </div>
      `;
      resultCard.classList.remove('hidden');
    }

    // 渲染：已於特定時間兌換過
    function renderResultAlreadyRedeemed(record) {
      resultCard.className = 'rounded-2xl border-2 border-amber-500 bg-amber-50/80 p-6 status-enter';
      resultCard.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-600 text-white shadow-sm">
              <i class="ph ph-warning-circle-fill text-sm"></i>
              請勿重複發送貼圖
            </div>
            <h3 class="text-xl sm:text-2xl font-bold text-amber-900 tracking-tight">此序號已完成兌換！</h3>
            <p class="text-xs sm:text-sm text-amber-800 mt-1">
              序號 <span class="font-mono font-bold bg-white px-2 py-0.5 rounded border border-amber-300">${escapeHtml(record.code)}</span>
              已於 <span class="font-semibold underline">${record.redeemedAt || '先前'}</span> 完成領取。
            </p>
          </div>
          <div>
            <button onclick="focusInputAndClear()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-amber-300 bg-white hover:bg-amber-100/50 text-amber-900 font-semibold text-xs transition">
              確認並清空
            </button>
          </div>
        </div>
      `;
      resultCard.classList.remove('hidden');
    }

    // 渲染：不符資格
    function renderResultMismatch(inputCode) {
      resultCard.className = 'rounded-2xl border-2 border-rose-500 bg-rose-50/80 p-6 status-enter';
      resultCard.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-rose-600 text-white shadow-sm">
              <i class="ph ph-x-circle-fill text-sm"></i>
              無效序號
            </div>
            <h3 class="text-2xl sm:text-3xl font-extrabold text-rose-800 tracking-tight">不符兌換資格</h3>
            <p class="text-xs sm:text-sm text-rose-700 mt-1">
              輸入的序號「<span class="font-mono font-bold">${escapeHtml(inputCode)}</span>」不存在於名單中，請請讀者重新確認。
            </p>
          </div>
          <div>
            <button onclick="focusInputAndClear()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-rose-300 bg-white hover:bg-rose-100/50 text-rose-900 font-semibold text-xs transition">
              重新輸入
            </button>
          </div>
        </div>
      `;
      resultCard.classList.remove('hidden');
    }

    // 執行核銷
    window.executeRedeem = function(index, isAuto = false) {
      if (!codeRecords[index]) return;
      codeRecords[index].isRedeemed = true;
      codeRecords[index].redeemedAt = formatDateTime();
      saveToStorage();
      renderUI();

      // 核銷完成卡片
      resultCard.className = 'rounded-2xl border-2 border-brand-500 bg-brand-50/80 p-6 status-enter';
      resultCard.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-brand-600 text-white shadow-sm">
              <i class="ph ph-check text-sm"></i>
              ${isAuto ? '已自動完成核銷' : '核銷成功'}
            </div>
            <h3 class="text-xl sm:text-2xl font-bold text-brand-800">已將此序號標記為「已發送貼圖」！</h3>
            <p class="text-xs text-brand-700 font-mono">
              序號：${escapeHtml(codeRecords[index].code)} ｜ 核銷時間：${codeRecords[index].redeemedAt}
            </p>
          </div>
          <div>
            <button onclick="focusInputAndClear()" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs transition shadow-sm">
              處理下一位
            </button>
          </div>
        </div>
      `;
    };

    // 快速清空並讓焦點回到輸入框
    window.focusInputAndClear = function() {
      codeQueryInput.value = '';
      resultCard.classList.add('hidden');
      codeQueryInput.focus();
    };

    // 取消核銷 (手動退回未兌換)
    window.toggleRedeemManual = function(index) {
      if (!codeRecords[index]) return;
      const target = codeRecords[index];
      if (target.isRedeemed) {
        showNotice('取消核銷確認', `確定要將序號「${target.code}」改回「尚未兌換」嗎？`, true, () => {
          target.isRedeemed = false;
          target.redeemedAt = null;
          saveToStorage();
          renderUI();
          resultCard.classList.add('hidden');
        });
      } else {
        target.isRedeemed = true;
        target.redeemedAt = formatDateTime();
        saveToStorage();
        renderUI();
      }
    };

    // --- UI 渲染與更新 ---
    function renderUI() {
      const total = codeRecords.length;
      const redeemed = codeRecords.filter(r => r.isRedeemed).length;
      const pending = total - redeemed;

      statTotal.textContent = total.toLocaleString();
      statRedeemed.textContent = redeemed.toLocaleString();
      statPending.textContent = pending.toLocaleString();

      if (total === 0) {
        dataStatusBadge.className = 'text-xs px-2.5 py-0.5 rounded-full font-medium bg-sand-200 text-sand-700';
        dataStatusBadge.textContent = '尚未匯入清單';
        btnClearData.disabled = true;
        btnExportExcel.disabled = true;
      } else {
        dataStatusBadge.className = 'text-xs px-2.5 py-0.5 rounded-full font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
        dataStatusBadge.textContent = `運作中 (剩餘 ${pending} 筆)`;
        btnClearData.disabled = false;
        btnExportExcel.disabled = false;
      }

      renderTable();
    }

    // 渲染表格資料
    function renderTable() {
      const statusFilter = filterStatus.value;
      const keyword = filterKeyword.value.trim().toLowerCase();

      const filtered = codeRecords.filter(item => {
        // 狀態篩選
        if (statusFilter === 'pending' && item.isRedeemed) return false;
        if (statusFilter === 'redeemed' && !item.isRedeemed) return false;
        // 關鍵字搜尋
        if (keyword && !item.code.toLowerCase().includes(keyword)) return false;
        return true;
      });

      badgeFilteredCount.textContent = `${filtered.length} 筆`;

      if (codeRecords.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-10 text-center text-sand-700">
              <i class="ph ph-tray text-3xl mb-1 text-sand-700"></i>
              <p>目前尚無序號，請先自上方匯入檔案或貼上資料</p>
            </td>
          </tr>
        `;
        return;
      }

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-sand-700">沒有符合搜尋條件的序號</td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map((item, i) => {
        const originalIndex = codeRecords.indexOf(item);
        const statusBadge = item.isRedeemed 
          ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
               <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>已兌換
             </span>`
          : `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
               <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>待領取
             </span>`;

        return `
          <tr class="hover:bg-sand-50/60 transition group">
            <td class="py-2.5 px-4 text-center text-sand-700 text-xs">${i + 1}</td>
            <td class="py-2.5 px-4 font-mono font-medium text-sand-800">${escapeHtml(item.code)}</td>
            <td class="py-2.5 px-4">${statusBadge}</td>
            <td class="py-2.5 px-4 text-sand-700 text-xs font-mono">${item.redeemedAt || '-'}</td>
            <td class="py-2.5 px-4 text-right">
              <button onclick="toggleRedeemManual(${originalIndex})" class="text-xs px-2.5 py-1 rounded-lg border border-sand-200 hover:bg-sand-100 text-sand-700 font-medium transition">
                ${item.isRedeemed ? '取消核銷' : '標記兌換'}
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 匯出帶有核銷結果的 Excel
    function exportToExcel() {
      if (codeRecords.length === 0) {
        showNotice('無法匯出', '名單中無任何資料');
        return;
      }

      const exportData = codeRecords.map((item, idx) => ({
        '編號': idx + 1,
        '序號': item.code,
        '兌換狀態': item.isRedeemed ? '已完成兌換' : '尚未兌換',
        '核銷發送時間': item.redeemedAt || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '貼圖核銷進度紀錄');

      const dateStr = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `LINE貼圖核銷紀錄_${dateStr}.xlsx`);
    }

    // 安全字元跳脫
    function escapeHtml(string) {
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
